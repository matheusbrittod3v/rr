[phases.setup]
nixPkgs = [
  "php83",
  "php83Packages.composer",
  "nodejs_20",
  "nginx"
]

phpExtensions = [
  "intl",
  "zip",
  "mbstring",
  "bcmath",
  "curl",
  "gd",
  "pdo",
  "pdo_mysql",
  "redis",
  "opcache"
]

[phases.build]
cmds = [
  "composer install --no-dev --optimize-autoloader --no-interaction",
  "npm ci",
  "npm run build"
]

[start]
cmd = "php-fpm & nginx -g 'daemon off;'"

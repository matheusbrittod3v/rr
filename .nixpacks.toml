[phases.setup]
nixPkgs = [
  "php83",
  "php83Packages.composer",
  "nodejs_18",
  "nginx"
]

phpExtensions = [
  "bcmath",
  "ctype",
  "curl",
  "gd",
  "iconv",
  "intl",
  "mbstring",
  "opcache",
  "pdo",
  "pdo_mysql",
  "pdo_pgsql",
  "redis",
  "zip"
]

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader --no-interaction",
  "npm ci --omit=dev"
]

[phases.build]
cmds = [
  "php artisan config:cache",
  "php artisan route:cache",
  "php artisan view:cache",
  "npm run build"
]

[start]
cmd = "{nginx_start_serving_cmd}"

[variables]
NIXPACKS_PHP_ROOT_DIR = "/app/public" 

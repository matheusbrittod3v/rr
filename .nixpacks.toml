[phases.setup]
nixPkgs = [
  "php83",
  "php83Packages.composer",
  "nodejs_18",
  "nginx"
]

# Pin to a specific Nixpkgs archive for reproducibility (Node 18.x LTS)
nixPkgsArchive = "a5a5e4ccc0c1b30c13a8c5f6aafbefd8fc66ec1a"

phpExtensions = [
  "bcmath",
  "ctype",
  "curl",
  "gd",
  "iconv",
  "intl",
  "mbstring",
  "opcache",
  "pdo",
  "pdo_mysql",
  "pdo_pgsql",
  "redis",
  "zip"
]

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader --no-interaction",
  "echo '=== Verificando Node.js e NPM ==='",
  "node --version",
  "npm --version",
  "echo '=== Atualizando NPM para última versão estável ==='",
  "npm install -g npm@latest || true",
  "npm --version",
  "echo '=== Instalando dependências NPM (incluindo devDependencies para build) ==='",
  "if [ -f package-lock.json ]; then npm ci --include=dev; else npm install --include=dev; fi",
  "echo '=== Dependências instaladas com sucesso ==='"
]

[phases.build]
cmds = [
  "echo '=== Iniciando build de assets ==='",
  "node --version",
  "npm --version",
  "echo '=== Executando npm run build ==='",
  "npm run build || (echo 'ERRO no build! Reinstalando dependências...' && rm -rf node_modules && npm install --include=dev && npm run build)",
  "echo '=== Verificando se build foi gerado ==='",
  "ls -la public/build/ || echo 'AVISO: Diretório public/build não encontrado'",
  "echo '=== Build concluído com sucesso ==='",
  "php artisan config:cache",
  "php artisan route:cache",
  "php artisan view:cache",
  "echo '=== Cache do Laravel gerado ==='"
]

[start]
cmd = "{nginx_start_serving_cmd}"

[variables]
NIXPACKS_PHP_ROOT_DIR = "/app/public"
NIXPACKS_NODE_VERSION = "18"
NPM_CONFIG_PRODUCTION = "false"
NODE_ENV = "production"

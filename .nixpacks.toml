[phases.setup]
nixPkgs = [
  "php83",
  "php83Packages.composer"
]

# Apenas extensões essenciais para o Reverb
phpExtensions = [
  "bcmath",
  "ctype",
  "curl",
  "iconv",
  "mbstring",
  "opcache",
  "pdo",
  "redis",
  "zip"
]

[phases.install]
# Instala apenas dependências PHP, sem npm
cmds = [
  "composer install --no-dev --optimize-autoloader --no-interaction"
]

[phases.build]
# Apenas cache de configuração Laravel (necessário para o Reverb funcionar)
cmds = [
  "php artisan config:cache"
]

[start]
# Inicia apenas o servidor Reverb
cmd = "php artisan reverb:start"

[variables]
# Não precisa de NIXPACKS_PHP_ROOT_DIR pois não há servidor web

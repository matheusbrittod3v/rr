# ============================================
# CONFIGURAÇÃO TRAEFIK - LARAVEL + REVERB
# ============================================
# Domínio: uniontechnicals.com
# Aplicação Laravel: porta 8082
# Reverb WebSocket: porta 8080
# ============================================

http:
  routers:
    # ============================================
    # APLICAÇÃO LARAVEL (HTTP/HTTPS)
    # ============================================
    
    # Router HTTP - Redireciona para HTTPS
    laravel-http:
      rule: Host(`uniontechnicals.com`) && !PathPrefix(`/app/`)
      service: laravel-service
      middlewares:
        - redirect-to-https
      entryPoints:
        - web
      priority: 10
    
    # Router HTTPS - Aplicação Laravel
    laravel-https:
      rule: Host(`uniontechnicals.com`) && !PathPrefix(`/app/`)
      service: laravel-service
      middlewares: []
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      priority: 10
    
    # ============================================
    # REVERB WEBSOCKET (HTTP/HTTPS/WSS)
    # ============================================
    
    # Router HTTP - Reverb WebSocket (redireciona para HTTPS)
    reverb-http:
      rule: Host(`uniontechnicals.com`) && (PathPrefix(`/app/`) || Headers(`Upgrade`, `websocket`))
      service: reverb-service
      middlewares:
        - redirect-to-https
      entryPoints:
        - web
      priority: 20
    
    # Router HTTPS/WSS - Reverb WebSocket
    reverb-https:
      rule: Host(`uniontechnicals.com`) && (PathPrefix(`/app/`) || Headers(`Upgrade`, `websocket`))
      service: reverb-service
      middlewares:
        - strip-websocket-prefix  # Remove /app/ se necessário
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      priority: 20

  services:
    # ============================================
    # SERVIÇO LARAVEL
    # ============================================
    laravel-service:
      loadBalancer:
        servers:
          - url: http://aplication-pdr-laravel-aplication-dqvnri:8082
        passHostHeader: true
        healthCheck:
          path: /up
          interval: 30s
          timeout: 5s
    
    # ============================================
    # SERVIÇO REVERB
    # ============================================
    reverb-service:
      loadBalancer:
        servers:
          - url: http://aplication-pdr-laravel-aplication-dqvnri:8080
        passHostHeader: true
        # WebSocket precisa de configurações especiais
        # Traefik detecta automaticamente Upgrade: websocket

  middlewares:
    # ============================================
    # MIDDLEWARES
    # ============================================
    
    # Redirecionamento HTTP -> HTTPS
    redirect-to-https:
      redirectScheme:
        scheme: https
        permanent: true
    
    # Remove prefixo /app/ se necessário (opcional)
    strip-websocket-prefix:
      stripPrefix:
        prefixes:
          - /app

